<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — pool-anything</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --ink: #1B1917;
    --ink-soft: #57534E;
    --ink-faint: #8A8680;
    --line: #E8E3D9;
    --accent: #C15F3C;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line);
  }
  .bar .mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; }
  .bar .mark img { width: 26px; height: 26px; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 90px 22px 60px;
  }
  .status {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    font-weight: 700;
    color: var(--ink-faint);
    margin: 0 0 4px;
  }
  h1 {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(30px, 5vw, 42px);
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin: 0 0 10px;
  }
  p { color: var(--ink-soft); margin: 0 0 26px; max-width: 46ch; }
  .go { display: flex; gap: 10px; flex-wrap: wrap; }
  .go a {
    font-size: 14px; font-weight: 500; text-decoration: none;
    padding: 9px 18px; border-radius: 999px;
  }
  .go a.primary { background: var(--ink); color: #fff; }
  .go a.primary:hover { background: #000; }
  .go a.secondary { border: 1px solid var(--line); color: var(--ink); }
  .go a.secondary:hover { border-color: var(--ink-soft); }
  footer {
    max-width: 560px; margin: 0 auto; padding: 0 22px 40px;
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint);
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="mark" href="/"><img src="/logo.png" alt="" onerror="this.remove()" />pool-anything</a>
  </header>
  <main>
    <p class="status">404</p>
    <h1>That address isn't in the pool.</h1>
    <p>The page moved or never existed. The two that do exist are below.</p>
    <div class="go">
      <a class="primary" href="/">Landing</a>
      <a class="secondary" href="/docs.html">Docs</a>
    </div>
  </main>
  <footer>pool-anything · round-robin key pool · zero runtime deps</footer>
</body>
</html>
