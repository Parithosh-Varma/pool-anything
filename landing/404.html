<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — pool-anything</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --porcelain: #E9EFEA;
    --card: #F6F9F6;
    --ink: #15211E;
    --ink-soft: #3A4A46;
    --teal: #0E7C6B;
    --teal-deep: #0A5A4E;
    --copper: #B44A1F;
    --mist: #9AA9A3;
    --line: #C9D4CE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--porcelain);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--teal); color: #fff; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; border-radius: 4px; }

  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line);
  }
  .bar .mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; }
  .bar .mark img { width: 26px; height: 26px; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 90px 22px 60px;
  }
  .status {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--copper);
    margin: 0 0 14px;
  }
  h1 {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 42px);
    letter-spacing: -0.02em;
    line-height: 1.08;
    margin: 0 0 10px;
  }
  p { color: var(--ink-soft); margin: 0 0 26px; max-width: 46ch; }
  .go { display: flex; gap: 10px; flex-wrap: wrap; }
  .go a {
    font-size: 14px; font-weight: 500; text-decoration: none;
    padding: 9px 18px; border-radius: 999px;
  }
  .go a.primary { background: var(--ink); color: #fff; }
  .go a.primary:hover { background: var(--teal-deep); }
  .go a.secondary { border: 1.5px solid var(--line); color: var(--ink); }
  .go a.secondary:hover { border-color: var(--ink-soft); }
  footer {
    max-width: 560px; margin: 0 auto; padding: 0 22px 40px;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--mist);
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="mark" href="/"><img src="/logo.png" alt="" onerror="this.remove()" />pool-anything</a>
  </header>
  <main>
    <p class="status">404</p>
    <h1>That address isn't in the pool.</h1>
    <p>The page moved or never existed. The two that do exist are below.</p>
    <div class="go">
      <a class="primary" href="/">Landing</a>
      <a class="secondary" href="/docs.html">Docs</a>
    </div>
  </main>
  <footer>pool-anything · round-robin key pool · zero runtime deps</footer>
</body>
</html>
